name: MarkdownBrowser
options:
  bundleIdPrefix: com.guillaumewinter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Apple silicon only; native/build.sh builds the Rust core for these architectures.
    ARCHS: arm64
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # The UniFFI C module (MdbCoreFFI) that the MdbCore bindings import, generated by native/build.sh.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/native/generated

packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3

targets:
  MdbCore:
    type: library.static
    platform: macOS
    sources:
      - path: native/generated/MdbCore.swift
        optional: true
        # Explicit file entries remain compile sources before generated bindings exist.
        type: file
    preBuildScripts:
      - name: Build native core
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/native/generated/MdbCore.swift
          - $(SRCROOT)/native/generated/MdbCoreFFI.h
          - $(SRCROOT)/native/generated/module.modulemap
          - $(BUILT_PRODUCTS_DIR)/libmdb_core.a
        script: |
          "$SRCROOT/native/build.sh" "$BUILT_PRODUCTS_DIR"
    settings:
      base:
        # UniFFI's generated bindings are thread-safe and must be callable off the main actor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  MarkdownBrowser:
    type: application
    platform: macOS
    dependencies:
      - target: MdbCore
      - package: SwiftMath
    sources:
      - path: MarkdownBrowser
        excludes:
          - "**/.DS_Store"
      - path: cli/mdb
        buildPhase:
          copyFiles:
            destination: sharedSupport
            subpath: bin
    entitlements:
      path: MarkdownBrowser/MarkdownBrowser.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    info:
      path: MarkdownBrowser/Info.plist
      properties:
        CFBundleDisplayName: MarkdownBrowser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Guillaume Winter. MIT License."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.source-code]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumewinter.MarkdownBrowser
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Rust core (native/mdb-core), built into the products folder by native/build.sh.
        OTHER_LDFLAGS: $(inherited) -lmdb_core
        COMBINE_HIDPI_IMAGES: YES

  MarkdownBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarkdownBrowserTests
      - path: goldens
        type: folder
        buildPhase: resources
    dependencies:
      - target: MarkdownBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumewinter.MarkdownBrowserTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MarkdownBrowser:
    build:
      targets:
        MarkdownBrowser: all
        MarkdownBrowserTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarkdownBrowserTests
