[package]
name = "mdb-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
# Only the bindings generator needs UniFFI's command-line tool; the library linked into the app doesn't.
bindgen = ["uniffi/cli"]

[dependencies]
comrak = { version = "1.0", default-features = false, features = ["shortcodes"] }
ammonia = "4.2"
scraper = "0.29"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-themes", "regex-fancy"] }
mermaid-rs-renderer = { version = "0.3", default-features = false }
resvg = "0.50"
thiserror = "2"
unicode-general-category = "1"
regress = { version = "0.12.0", features = ["utf16"] }
unicode-normalization = "0.1.26"
uniffi = "0.32.2"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
