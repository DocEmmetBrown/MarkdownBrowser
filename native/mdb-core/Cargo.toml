[package]
name = "mdb-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
# Only the bindings generator needs UniFFI's command-line tool; the library linked into the app doesn't.
bindgen = ["uniffi/cli"]

[dependencies]
regress = { version = "0.12.0", features = ["utf16"] }
unicode-normalization = "0.1.26"
uniffi = "0.32.2"
