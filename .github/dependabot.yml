version: 2
updates:
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Don't pick up a freshly-published action version the moment it lands.
    cooldown:
      default-days: 2
